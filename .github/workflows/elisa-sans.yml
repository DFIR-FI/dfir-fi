name: Import Elisa SANS FOR trainings
on:
  schedule:
    - cron: "0 5 * * 1" # Mondays 05:00 UTC
  workflow_dispatch:

concurrency: elisa-sans

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Git checkout
        uses: actions/checkout@v4
        with:
          ref: main
          # Personal token: pushes made with it trigger the deploy workflow
          # (pushes with the default GITHUB_TOKEN don't trigger workflows)
          token: ${{ secrets.TOKEN }}

      - name: Setup python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Import sessions
        run: python3 tools/elisa_sans.py

      - name: Commit and push changes
        run: |
          if [ -z "$(git status --porcelain content/training)" ]; then
            echo "No changes"
            exit 0
          fi
          git config user.name "who1s"
          git config user.email "juho@dfir.fi"
          git add content/training
          git commit -m "Update Elisa SANS FOR trainings"
          git push origin main
