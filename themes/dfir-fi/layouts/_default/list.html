{{ define "main" }}
<div class="wrap">
    <header class="page-head">
        <h1>{{ .Title }} blog posts</h1>
    </header>
    <div class="post-list">
        {{ range where .Pages.ByWeight ".Params.draft" "!=" true }}
            {{ partial "post-row.html" . }}
        {{ end }}
    </div>
</div>
{{ end }}
