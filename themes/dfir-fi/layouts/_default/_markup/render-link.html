{{- /* Markdown links: open links to other sites in a new tab */ -}}
{{- $u := urls.Parse .Destination -}}
{{- $external := and $u.IsAbs (in (slice "http" "https") $u.Scheme) (ne $u.Host (urls.Parse site.BaseURL).Host) -}}
<a href="{{ .Destination | safeURL }}"
  {{- with .Title }} title="{{ . }}"{{ end }}
  {{- if $external }} target="_blank" rel="noopener"{{ end }}>
  {{- .Text | safeHTML -}}
</a>
{{- /* chomp trailing newline */ -}}
