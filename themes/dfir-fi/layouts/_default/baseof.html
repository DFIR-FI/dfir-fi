<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>DFIR-FI » {{ .Title }}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#000000">
    <link rel="icon" href="{{ "favicon.ico" | relURL }}" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="{{ "images/favicon-32.png" | relURL }}">
    <link rel="icon" type="image/png" sizes="16x16" href="{{ "images/favicon-16.png" | relURL }}">
    <link rel="apple-touch-icon" href="{{ "images/apple-touch-icon.png" | relURL }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="{{ "css/style.css" | relURL }}">
    {{- with site.Params.sisterSite }}
    <script>
        /* Arriving from the sister site: play the glitch-in (see .arriving in style.css) */
        (function () {
            try {
                var from = new URL(document.referrer).host.replace(/^www\./, '');
                var sister = {{ (urls.Parse .url).Host | strings.TrimPrefix "www." }};
                if (from === sister && !window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
                    document.documentElement.classList.add('arriving');
                }
            } catch (e) { /* no or invalid referrer */ }
        })();
    </script>
    {{- end }}
</head>
<body>
    {{ partial "header.html" . }}
    <main>
        {{ block "main" . }}{{ end }}
    </main>
    {{ partial "footer.html" . }}
    {{ partial "scripts.html" . }}
</body>
</html>
