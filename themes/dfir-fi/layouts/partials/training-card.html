{{- with . }}
<article class="card training-card{{ if not .Params.listImage }} no-image{{ end }}">
    {{- with .Params.listImage }}
    <img src="/images/{{ . }}" class="card-img" alt="{{ $.Params.provider }}">
    {{- end }}
    <div class="card-body">
        <p class="meta">{{ partial "course-dates.html" . }} · {{ .Params.provider }} · {{ .Params.language }}</p>
        <h3 class="card-title"><a href="{{ partial "referral-url.html" .Params.courselink }}" target="_blank" rel="noopener">{{ .Title }}</a></h3>
        <p>{{ .Summary | plainify }}</p>
        <p class="meta">Price: <a href="{{ partial "referral-url.html" .Params.courselink }}" target="_blank" rel="noopener">{{ .Params.pricing }}</a>
            {{- with .Params.author }} · By <a href="/about/{{ . }}">{{ . }}</a>{{ end }}</p>
    </div>
</article>
{{- end }}
