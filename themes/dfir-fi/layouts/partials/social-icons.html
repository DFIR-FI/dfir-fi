<div class="social-icons">
    {{ with .twitter }}<a href="https://twitter.com/{{ . }}" target="_blank" rel="noopener" aria-label="X"><i class="fab fa-x-twitter"></i></a>{{ end }}
    {{ with .linkedin }}<a href="https://linkedin.com/in/{{ . }}" target="_blank" rel="noopener" aria-label="LinkedIn"><i class="fab fa-linkedin"></i></a>{{ end }}
    {{ with .github }}<a href="https://github.com/{{ . }}" target="_blank" rel="noopener" aria-label="GitHub"><i class="fab fa-github"></i></a>{{ end }}
    {{ with .credly }}<a href="{{ . }}" target="_blank" rel="noopener" aria-label="Credly"><i class="fas fa-certificate"></i></a>{{ end }}
    {{ with .discord }}<a href="https://discord.com/users/{{ . }}" target="_blank" rel="noopener" aria-label="Discord"><i class="fab fa-discord"></i></a>{{ end }}
    {{ with .website }}<a href="{{ . }}" target="_blank" rel="noopener" aria-label="Website"><i class="fas fa-globe"></i></a>{{ end }}
    {{ with .email }}<a href="mailto:{{ . }}" aria-label="Email"><i class="fas fa-envelope"></i></a>{{ end }}
</div>
