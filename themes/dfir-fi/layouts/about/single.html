{{ define "main" }}
<div class="wrap about-layout">
    <aside class="card author-content">
        <img src="{{ .Params.photo | relURL }}" class="author-avatar" alt="{{ .Params.name }}">
        <h1>{{ .Params.name }}</h1>
        <p class="meta">{{ .Params.title }}</p>
        {{ partial "social-icons.html" .Params }}
        <p class="introtext">{{ .Params.introtext }}</p>
    </aside>
    <div class="content prose">{{ .Content }}</div>
</div>
{{ end }}
