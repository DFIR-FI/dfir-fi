{{ define "main" }}
<div class="wrap">
    <header class="page-head">
        <h1>{{ .Title }}</h1>
    </header>
    <div class="content prose">{{ .Content }}</div>

    <h2 class="section-title">Author(s)</h2>
    <div class="author-grid">
        {{ range where .Pages.ByWeight ".Params.draft" "!=" true }}
        <article class="card author-card">
            <img src="{{ .Params.photo | relURL }}" class="author-avatar" alt="{{ .Params.name }}">
            <div class="card-body">
                <h3 class="author-name"><a href="{{ .RelPermalink }}" class="name-link">{{ .Params.name }}</a></h3>
                <p class="meta">{{ .Params.title }}</p>
                {{ partial "social-icons.html" .Params }}
            </div>
        </article>
        {{ end }}
    </div>
</div>
{{ end }}
