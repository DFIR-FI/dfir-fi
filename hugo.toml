baseURL = 'https://dfir.fi/'
languageCode = 'en-us'
title = 'DFIR Finland'
theme = "dfir-fi"
# Last-modified dates (.Lastmod, .GitInfo) come from git history
enableGitInfo = true

[outputs]
  home = ["HTML", "RSS"]
  section = ["HTML"]
  page = ["HTML"]
  taxonomy = ["HTML"]
  term = ["HTML"]

[outputFormats]
  [outputFormats.RSS]
    name = "RSS"
    mediaType = "application/rss+xml"
    baseName = "rss"
    isPlainText = true
    rel = "alternate"

[params]
  mainSections = ["blog"]
  company_name = "0J Consulting Oy"
  company_link = "https://0j.fi"
  # Commits that touched provider files without changing their content
  # (theme migration, Deloitte's late add commit). While one of these is a
  # provider's last commit, it counts as not modified ("—" in the list).
  lastmodIgnoreCommits = [
    "b6ad3389c0ba514c87a41f4d63eaf92d653b81c7", # New shiny theme for dfir.fi
    "b17b66d68aecef17aa90f0a9722fc9f727f34a74", # Fixed few links and added deloitte
  ]

[[menu.main]]
  name = "Home"
  pageRef = "/"
  weight = 10

[[menu.main]]
  name = "Contribute"
  pageRef = "/contribute"
  weight = 11

[[menu.main]]
  name = "Blog"
  pageRef = "/blog"
  weight = 20

