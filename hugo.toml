baseURL = 'https://dfir.fi/'
languageCode = 'en-us'
title = 'DFIR Finland'
# Shared theme (git submodule) from github.com/zero-jargon/site-theme;
# theme changes go there, not into this repo
theme = "site-theme"
# Last-modified dates (.Lastmod, .GitInfo) come from git history
enableGitInfo = true

[outputs]
  home = ["HTML", "RSS"]
  section = ["HTML"]
  page = ["HTML"]
  taxonomy = ["HTML"]
  term = ["HTML"]

[outputFormats]
  [outputFormats.RSS]
    name = "RSS"
    mediaType = "application/rss+xml"
    baseName = "rss"
    isPlainText = true
    rel = "alternate"

[params]
  mainSections = ["blog"]
  company_name = "0J Consulting Oy"
  company_link = "https://0j.fi"
  # Site identity for the shared theme
  brand = "DFIR-FI"              # <title> prefix, logo alt/aria-label
  siteName = "dfir.fi"           # footer copyright line
  trainingTitle = "DFIR Training" # Training page heading
  # Commits that touched provider files without changing their content
  # (theme migration, Deloitte's late add commit). While one of these is a
  # provider's last commit, it counts as not modified ("—" in the list).
  lastmodIgnoreCommits = [
    "b6ad3389c0ba514c87a41f4d63eaf92d653b81c7", # New shiny theme for dfir.fi
    "b17b66d68aecef17aa90f0a9722fc9f727f34a74", # Fixed few links and added deloitte
  ]
  # Appended to provider and training links so they can see referrals from us
  referralQuery = "utm_source=dfir.fi&utm_medium=referral"

  # Sister site: linked from the menu, opens in the same tab with a glitch
  # transition. csoc.fi sets this to dfir.fi, so the effect works both ways.
  [params.sisterSite]
    name = "CSOC.FI"
    url = "https://csoc.fi/"

[[menu.main]]
  name = "Home"
  pageRef = "/"
  weight = 10

[[menu.main]]
  name = "Contribute"
  pageRef = "/contribute"
  weight = 11

[[menu.main]]
  name = "Blog"
  pageRef = "/blog"
  weight = 20

[[menu.main]]
  name = "Training"
  pageRef = "/training"
  weight = 20

[[menu.main]]
  name = "Community"
  pageRef = "/community"
  weight = 21

[[menu.main]]
  name = "About"
  pageRef = "/about"
  weight = 40
